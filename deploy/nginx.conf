# 智学 · Nginx 反代配置模板
# 用法：复制到 /etc/nginx/conf.d/zhixue.conf，把 your-domain.com 换成你的域名。
# 关键点（每一行都有原因，别随手删）：
#   client_max_body_size 25m —— Nginx 默认 1m，不改的话 20MB 课件上传直接 413
#   proxy_buffering off      —— 不关缓冲，SSE 逐字流式回答会被攒成一坨再吐出来
#   proxy_read_timeout 300s  —— 出题/图谱接口最长 120s，留余量

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    client_max_body_size 25m;
    client_body_timeout 120s;

    # 编译产物带内容哈希，可以长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 流式响应与 WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则回答不是逐字出现
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
