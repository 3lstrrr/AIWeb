# Render Blueprint：把本项目部署为常驻 Node 服务（Next.js `next start`）。
# 用法：Render Dashboard → New → Blueprint → 选择本仓库 → 填入标了 sync:false 的变量 → Apply。
# 说明：Render 免费版会在 15 分钟无请求后休眠，下次请求冷启动约 30–60 秒；启动后功能与付费版一致。

services:
  - type: web
    name: zhixue
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # 构建：装依赖 + next build（环境变量在建阶段可见，NEXT_PUBLIC_* 会被内联进产物）
    buildCommand: npm ci && npm run build
    # 启动：next start 会自动读取 Render 注入的 PORT
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # 固定 Node 大版本，避免 Render 默认值漂移
      - key: NODE_VERSION
        value: "20"

      # 以下必填，Apply 时逐项填写（sync:false = 不在仓库里存值）
      - key: ZHIPU_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 首次部署后填 https://<你的服务名>.onrender.com，CORS/OG 卡片用
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # 可选：评审访问口令（两项都填才生效）
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
